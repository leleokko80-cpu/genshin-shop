name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Backend unit tests
        working-directory: backend
        run: mvn -B test

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend build check
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build-image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows]
    env:
      REGISTRY: localhost:8082
      PROJECT: devops
    steps:
      - uses: actions/checkout@v4
      - name: Debug secrets (lengths only)
        shell: powershell
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          Write-Host "user length: $($env:HARBOR_USERNAME.Length)"
          Write-Host "pass length: $($env:HARBOR_PASSWORD.Length)"
      - name: Build, tag with commit SHA and push to Harbor
        shell: powershell
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_PASSWORD }}
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)

          $env:HARBOR_PASSWORD | docker login $env:REGISTRY -u $env:HARBOR_USERNAME --password-stdin
          if ($LASTEXITCODE -ne 0) { exit 1 }

          foreach ($name in @("backend", "frontend")) {
            $image = "$env:REGISTRY/$env:PROJECT/genshin-shop-$name"
            docker build -t "${image}:$sha" "./$name"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            docker tag "${image}:$sha" "${image}:latest"
            docker push "${image}:$sha"
            if ($LASTEXITCODE -ne 0) { exit 1 }
            docker push "${image}:latest"
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

          docker logout $env:REGISTRY
          Write-Host "Pushed images with tag $sha"