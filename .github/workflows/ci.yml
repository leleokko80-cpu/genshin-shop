name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Backend unit tests
        working-directory: backend
        run: mvn -B test

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend build check
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build-image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v4

      - name: Build images tagged with the commit SHA
        shell: powershell
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)
          docker build -t "genshin-shop-backend:$sha" ./backend
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker build -t "genshin-shop-frontend:$sha" ./frontend
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker tag "genshin-shop-backend:$sha" genshin-shop-backend:latest
          docker tag "genshin-shop-frontend:$sha" genshin-shop-frontend:latest
          Write-Host "Images built with tag $sha"